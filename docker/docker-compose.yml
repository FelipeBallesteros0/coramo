services:
  coramo-llm:
    image: coramo-llm
    network_mode: host
    restart: "no"
    devices:
      - /dev/dri/renderD129
    group_add:
      - "44"
      - "992"
    volumes:
      - /home/coramo/coramo/models:/models:ro
    environment:
      - VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/radeon_icd.json
    command:
      - "--model"
      - "/models/Qwen3-4B-Q5_K_M.gguf"
      - "--n-gpu-layers"
      - "999"
      - "--ctx-size"
      - "1024"
      - "--cache-type-k"
      - "q8_0"
      - "--cache-type-v"
      - "q8_0"
      - "--parallel"
      - "1"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "--log-disable"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/v1/models"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  coramo-brain:
    image: coramo-brain
    build:
      context: ..
      dockerfile: docker/brain/Dockerfile
    network_mode: host
    restart: "no"
    depends_on:
      coramo-llm:
        condition: service_healthy
    devices:
      - /dev/snd
      - /dev/dri/renderD128
    group_add:
      - audio
      - dialout
      - "44"
      - "992"
    volumes:
      - /home/coramo/coramo/models:/models:ro
      - /home/coramo/piper-voices:/voices:ro
    environment:
      - WHISPER_BIN=/whisper.cpp/build/bin/whisper-cli
      - WHISPER_SERVER_BIN=/whisper.cpp/build/bin/whisper-server
      - WHISPER_SERVER_URL=http://127.0.0.1:8081
      - WHISPER_MODEL=/models/ggml-small.bin
      - VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/radeon_icd.json
      - LLAMA_HOST=127.0.0.1
      - LLAMA_PORT=8080
      - PIPER_BIN=/usr/local/piper/piper
      - PIPER_MODEL=/voices/es_ES-davefx-medium.onnx
      - OWW_MODEL=/models/coramo.onnx
      - MANAGED_LLM=false
      - CORAMO_LOG=/tmp/coramo-debug.log
      - ALSA_DEVICE=plughw:0,0
